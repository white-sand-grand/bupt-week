<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="北邮一周：课表与作业，登录一次即可查看。" />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23262320'/%3E%3Cpath d='m17 20 12 12-12 12m18 0h13' fill='none' stroke='%23d99b7b' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // 在样式与应用加载前恢复主题，避免刷新时闪回另一种颜色。
      let savedTheme
      try { savedTheme = localStorage.getItem('bupt-week-theme') } catch {}
      const initialTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = initialTheme
      document.querySelector('meta[name="theme-color"]').content = initialTheme === 'dark' ? '#121417' : '#f7f5f0'
    </script>
    <title>BUPT-week · 课表与作业</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
