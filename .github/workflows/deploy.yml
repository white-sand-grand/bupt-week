name: deploy

# 前端发布到 GitHub Pages。
# 后端部署不走 CI，手动执行 `npm run deploy:worker`（需要 wrangler login）。
#
# 需要的仓库变量：
#   VITE_BACKEND_URL  后端来源地址，例如 https://bupt-week.<subdomain>.workers.dev
#                     只写来源，不带路径、不带尾斜杠。
#                     未设置时前端按同源处理（本机开发就是这样）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # lockfile 已在仓库里，用 ci 保证可复现
      - run: npm ci
      - run: npm test
      - name: Build frontend
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
