name = "bupt-week"
main = "server/entries/worker.js"
compatibility_date = "2025-01-01"

# 本项目的 server/ 只使用 Web 标准 API（fetch / Headers / crypto.randomUUID），
# 不引入 node:fs，因此不需要 nodejs_compat。
# 会话存储通过 app.js 的 getSessionStore 注入，这里注入 KV 实现。

[vars]
# 允许跨域访问的前端来源，多个用逗号分隔。改成你自己的 Pages 地址。
CORS_ORIGINS = "https://white-sand-grand.github.io"
# 企微回流跳回前端的地址（带子路径，原样保留）。不配时 callback 只能靠
# Referer cookie 推导，而跨域 Referer 只有 origin——丢掉 /bupt-week/ 基路径，
# 回流会落在 Pages 根 404，表现为「企微识别失败」（2026-10-24 实测根因）。
FRONTEND_URL = "https://white-sand-grand.github.io/bupt-week"

# 班级功能数据（班级/成员/手动录入的作业）。与 SESSIONS 分开建 namespace，
# 避免会话清理逻辑（按 expiresAt 判活）误伤班级数据。
[[kv_namespaces]]
binding = "CLASSES"
id = "caf63daeb019431c923418f19e9addb7"

# 会话命名空间：SESSIONS 的 KV（id 来自 wrangler kv namespace create）。
# [[kv_namespaces]] 这一行是 TOML 表头，必须取消注释——只删 id 前面的注释
# 会让 binding/id 落进 [vars]，KV 绑定静默失效（2026-10-24 实测踩过）。
[[kv_namespaces]]
binding = "SESSIONS"
id = "09f026b17cb2401da4b1c89bb3b43a23"

# 国内可达：*.workers.dev 被墙，绑自定义域名绕开（见 docs/deployment.md「国内可达」）。
# 域名需先接入本 Cloudflare 账号（免费计划，NS 方式）并等 zone 激活，再取消下面两行
# 的注释、替换成真实域名后 wrangler deploy——证书和 DNS 由 Cloudflare 自动处理。
# 改后端地址后，记得同步更新仓库变量 VITE_BACKEND_URL 并重新构建前端。
# routes = [{ pattern = "api.<你的域名>", custom_domain = true }]