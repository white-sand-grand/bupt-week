name = "bupt-week"
main = "server/entries/worker.js"
compatibility_date = "2025-01-01"

# 本项目的 server/ 只使用 Web 标准 API（fetch / Headers / crypto.randomUUID），
# 不引入 node:fs，因此不需要 nodejs_compat。
# 会话存储通过 app.js 的 getSessionStore 注入，这里注入 KV 实现。

[vars]
# 允许跨域访问的前端来源，多个用逗号分隔。改成你自己的 Pages 地址。
CORS_ORIGINS = "https://white-sand-grand.github.io"

# 会话命名空间：SESSIONS 的 KV（id 来自 wrangler kv namespace create）。
# [[kv_namespaces]] 这一行是 TOML 表头，必须取消注释——只删 id 前面的注释
# 会让 binding/id 落进 [vars]，KV 绑定静默失效（2026-10-24 实测踩过）。
[[kv_namespaces]]
binding = "SESSIONS"
id = "09f026b17cb2401da4b1c89bb3b43a23"